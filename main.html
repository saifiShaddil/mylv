<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saniya ❤️</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Pinyon+Script&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            background: radial-gradient(circle at center, #0d0d0d, #000000);
        }

        /* ===== PARTICLES ===== */
        #canvas {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ===== MULTIPLE FLOATING HEARTS ===== */
        .bg-heart {
            position: absolute;
            color: #ff4da6;
            font-size: 20px;
            opacity: 0.3;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }

            to {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0.6;
            }
        }

        /* ===== MAIN HEART ===== */
        .heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        svg {
            width: 280px;
            height: 280px;
        }

        .heart {
            fill: none;
            stroke: #ff4da6;
            stroke-width: 2;
            filter: drop-shadow(0 0 20px #ff4da6);
        }

        /* ===== MAIN TEXT FIX ===== */
        .main-text {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            transform: translateY(-50%);
            z-index: 2;

            font-size: 4rem;
            font-family: 'Pinyon Script', cursive;

            background: linear-gradient(45deg, #ffffff, #ffb3d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.6),
                0 0 25px rgba(255, 77, 166, 0.6);

            transition: all 1s ease;
        }

        /* ===== BUTTON FIX ===== */
        .shayari-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            border-radius: 30px;

            font-size: 14px;
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);

            cursor: pointer;
            transition: 0.3s;
            z-index: 3;
        }

        .shayari-btn:hover {
            background: rgba(255, 77, 166, 0.3);
            transform: scale(1.05);
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 40px;
            border-radius: 25px;

            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);

            text-align: center;
            z-index: 5;

            width: 85%;
            max-width: 450px;

            box-shadow: 0 0 40px rgba(255, 77, 166, 0.6);
        }

        .modal.active {
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== SHAYARI STYLE ===== */
        .modal p {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: #ffb3d9;
            line-height: 1.6;
            text-shadow: 0 0 15px rgba(255, 77, 166, 0.8);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .main-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="shayari-btn" onclick="showShayari()">
        💖 Read a Love Shayari
    </div>

    <!-- Floating Hearts -->
    <script>
        for (let i = 0; i < 25; i++) {
            const heart = document.createElement("div");
            heart.className = "bg-heart";
            heart.innerHTML = "❤";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (5 + Math.random() * 10) + "s";
            heart.style.fontSize = (10 + Math.random() * 20) + "px";
            document.body.appendChild(heart);
        }
    </script>

    <div class="heart-container">
        <svg viewBox="0 0 512 512">
            <path class="heart"
                d="M256 464s-176-101-176-240c0-70 56-128 128-128 48 0 80 24 96 56 16-32 48-56 96-56 72 0 128 58 128 128 0 139-176 240-176 240z" />
        </svg>
    </div>

    <div class="main-text" id="text">Saniya</div>

    <div class="modal" id="modal">
        <p id="shayariText"></p>
    </div>

    <script>
        // HEART ANIMATION
        anime({
            targets: '.heart',
            strokeDashoffset: [anime.setDashoffset, 0],
            duration: 3000,
            loop: true,
            direction: 'alternate'
        });

        anime({
            targets: '.heart-container',
            scale: [1, 1.08],
            duration: 1500,
            loop: true,
            direction: 'alternate'
        });

        // TEXT CHANGE
        let clicked = false;
        document.body.addEventListener("click", () => {
            if (!clicked) {
                clicked = true;

                anime({
                    targets: '#text',
                    opacity: 0,
                    duration: 700,
                    complete: () => {
                        document.getElementById("text").innerText =
                            "Your husband is missing you in his life";

                        anime({
                            targets: '#text',
                            opacity: [0, 1],
                            translateY: [30, 0],
                            duration: 1200,
                            easing: 'easeOutExpo'
                        });
                    }
                });
            }
        });

        // SHAYARI
        const shayari = [
            "Tere bina adhura hoon main…",
            "Tum meri mohabbat ho, meri aadat ho…",
            "Har dhadkan mein bas naam tumhara hai…",
            "Tu mile toh zindagi mukammal lage…",
            "Meri har khushi tumse judi hai…"
        ];

        function showShayari() {
            const modal = document.getElementById("modal");
            const text = document.getElementById("shayariText");

            text.innerText = shayari[Math.floor(Math.random() * shayari.length)];

            modal.classList.add("active");

            anime({
                targets: '#shayariText',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 1000,
                easing: 'easeOutExpo'
            });

            setTimeout(() => modal.classList.remove("active"), 4500);
        }

        // PARTICLES
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2,
                dx: (Math.random() - 0.5),
                dy: (Math.random() - 0.5)
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4da6";

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });

            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>

</body>

</html>
